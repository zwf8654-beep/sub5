# 链式代理：机场中转 → SOCKS5 落地；适用于 Mihomo / Clash Meta
# 订阅由客户端拉取，请确保机场提供 Clash 格式
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
profile:
  store-selected: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver: [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
proxy-providers:
  airport:
    type: http
    url: "https://session.monikacloud.net/skt/55e5bb5f4ec8716ca2cb6f188a5c2d3b"
    path: ./proxy_providers/chain-airport.yaml
    interval: 3600
    proxy: DIRECT
    header:
      User-Agent: ["clash.meta"]
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
proxies:
  - name: "SOCKS5落地"
    type: socks5
    server: "216.132.151.109"
    port: 443
    username: "sMQGEpLGjbbB"
    password: "mZ87Fy24ex"
    udp: false
    dialer-proxy: "机场中转"
proxy-groups:
  - name: "出口选择"
    type: select
    proxies: ["SOCKS5落地", "机场中转"]
  - name: "机场中转"
    type: select
    use: [airport]
rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
  - MATCH,出口选择
