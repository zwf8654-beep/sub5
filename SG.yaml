proxy-groups:
  - name: 海外集中
    type: select
    proxies:
      - 自动选择
      - 负载均衡Hash
      - HKG 01【静态住宅/福利赠送】
      - 新加坡SGP【静态专线住宅】
  - name: 订阅信息
    type: select
    proxies:
      - 🔔剩余流量»199.23 GB
      - 重置使用流量剩余»28 天
      - 订阅逾期»2026-12-23
  - name: 自动选择
    type: fallback
    proxies:
      - HKG 01【静态住宅/福利赠送】
      - 新加坡SGP【静态专线住宅】
    url: http://www.gstatic.com/generate_204
    interval: 7200
  - name: 负载均衡Hash
    type: load-balance
    proxies:
      - HKG 01【静态住宅/福利赠送】
      - 新加坡SGP【静态专线住宅】
    url: http://www.gstatic.com/generate_204
    strategy: consistent-hashing
    interval: 7200
  - name: GLOBAL
    type: select
    proxies:
      - 自动选择
      - 🔔剩余流量»199.23 GB
      - 重置使用流量剩余»28 天
      - 订阅逾期»2026-12-23
      - 💡请选择以下节点
      - HKG 01【静态住宅/福利赠送】
      - 新加坡SGP【静态专线住宅】
rules:
  - DOMAIN,rss-cn.yyxc.org,DIRECT
  - GEOSITE,apple@cn,DIRECT
  - GEOSITE,steam@cn,DIRECT
  - GEOSITE,category-games@cn,DIRECT
