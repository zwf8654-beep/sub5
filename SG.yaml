mixed-port: 7890
ipv6: true
allow-lan: false
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090
log-level: warning
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
  skip-domain:
    - Mijia Cloud
    - +.push.apple.com
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-filter:
    - +.lan
    - +.local
    - +.market.xiaomi.com
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 8.8.4.4
    - system
  nameserver:
    - https://edge.yyxc.cc/dns-query/09bf9972-3199-4255-adb2-5b71caab1f6f
    - https://edge.yyxc.org/dns-query/8c47d5c9-3207-431e-a045-31b140b943c9
    - https://8.138.238.133:50008/dns-query/09bf9972-3199-4255-adb2-5b71caab1f6f
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 8.8.4.4
    - system
  proxy-server-nameserver:
    - https://edge.yyxc.cc/dns-query/09bf9972-3199-4255-adb2-5b71caab1f6f
    - https://edge.yyxc.org/dns-query/8c47d5c9-3207-431e-a045-31b140b943c9
    - https://8.138.238.133:50008/dns-query/09bf9972-3199-4255-adb2-5b71caab1f6f
ntp:
  enable: true
  write-to-system: false
geodata-mode: true
geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
