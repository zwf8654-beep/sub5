  - GEOSITE,google,海外集中
  - GEOSITE,category-scholar-!cn,海外集中
  - GEOSITE,linkedin,海外集中
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,海外集中
